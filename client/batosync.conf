# ─────────────────────────────────────────────────────────────
#  BatoSync Client Configuration
#  Save this file as /userdata/system/batosync.conf
#  The batosync.sh script will source it automatically if found.
# ─────────────────────────────────────────────────────────────

# IP address (or hostname) and port of your BatoSync Docker server
# Replace 192.168.1.100 with the actual IP of the machine running Docker
export BATOSYNC_SERVER="http://192.168.1.100:5000"

# Must match the API_KEY in your docker-compose.yml
# Leave blank (empty string) if you disabled authentication
export BATOSYNC_KEY="change_me_to_a_secret_passphrase"

# Where Batocera stores your save files (this default is correct for most installs)
export BATOSYNC_SAVES="/userdata/saves"

# A friendly name for this device — shows up in the server's save history
# Defaults to the machine's hostname if not set
export BATOSYNC_DEVICE="living-room-pi"

# Space-separated list of top-level save folders to exclude from sync
# Example: skip supermodel arcade NVRAM (high scores) and xbox360 profile data
# export BATOSYNC_EXCLUDE_DIRS="supermodel xbox360"
export BATOSYNC_EXCLUDE_DIRS=""

# What to do when two devices have both saved since the last sync
#   warn     — push your save anyway, log a warning (default)
#   skip     — keep the server version, log a warning
export BATOSYNC_CONFLICT="warn"

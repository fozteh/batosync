services:
  batosync:
    build: ./server
    container_name: batosync
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - batosync_data:/data/saves
    environment:
      # Optional: set a secret key so only your Batocera devices can connect.
      # Leave blank to disable authentication (fine on a private home network).
      - API_KEY=change_me_to_a_secret_passphrase
      # How many backup saves to keep per game (default: 3)
      - MAX_BACKUPS=20

volumes:
  batosync_data:
